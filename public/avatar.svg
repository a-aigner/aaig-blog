<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- The card gradient (.grad-green in globals.css) as a square. The two
       radial glows stand in for LuminousGradient's blurred circles. -->
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c4f3c"/>
      <stop offset="0.55" stop-color="#1f3a2c"/>
      <stop offset="1" stop-color="#13281d"/>
    </linearGradient>
    <radialGradient id="light" cx="0.18" cy="0.12" r="0.6">
      <stop offset="0" stop-color="#fff" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shade" cx="0.9" cy="0.95" r="0.55">
      <stop offset="0" stop-color="#000" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#base)"/>
  <rect width="512" height="512" fill="url(#light)"/>
  <rect width="512" height="512" fill="url(#shade)"/>
</svg>
