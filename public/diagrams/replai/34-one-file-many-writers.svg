<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" width="700" height="380" role="img">
  <style>
    .bg  { fill: #fbfbfa; }
    .card{ fill: #ffffff; stroke: rgb(26 26 26 / 0.12); stroke-width: 1; }
    .box { fill: rgb(26 26 26 / 0.035); stroke: rgb(26 26 26 / 0.12); stroke-width: 1; }
    .gbox{ fill: rgb(31 58 44 / 0.08); stroke: #1f3a2c; stroke-width: 1.2; }
    .p   { fill: #ffffff; stroke: #1a1a1a; stroke-width: 1.2; }
    .t   { font-family: ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif; fill: #1a1a1a; }
    .lbl { font-size: 9.5px; letter-spacing: 0.08em; fill: rgb(26 26 26 / 0.45); }
    .k   { font-size: 11.5px; font-weight: 600; }
    .m   { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; }
    .n   { font-size: 10.5px; fill: rgb(26 26 26 / 0.6); }
    .g   { fill: #1f3a2c; }
    .ln  { stroke: #1a1a1a; stroke-width: 1.1; fill: none; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a1a"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="700" height="380"/>

  <text class="t lbl" x="16" y="26">ONE NIGHTLY RUN, ONE ID FOR EVERY PROCESS IN IT</text>

  <rect class="box" x="16" y="40" width="170" height="36" rx="5"/><text class="t k" x="28" y="62">the nightly script</text>
  <rect class="box" x="16" y="84" width="170" height="36" rx="5"/><text class="t k" x="28" y="106">the CRM connector</text>
  <rect class="box" x="16" y="128" width="170" height="36" rx="5"/><text class="t k" x="28" y="150">eight pipeline steps</text>
  <rect class="box" x="16" y="172" width="170" height="36" rx="5"/><text class="t k" x="28" y="194">the wrapper script</text>

  <path class="ln" d="M 186 58 L 250 108" marker-end="url(#a)"/>
  <path class="ln" d="M 186 102 L 250 116" marker-end="url(#a)"/>
  <path class="ln" d="M 186 146 L 250 128" marker-end="url(#a)"/>
  <path class="ln" d="M 186 190 L 250 136" marker-end="url(#a)"/>

  <rect class="gbox" x="254" y="76" width="232" height="92" rx="8"/>
  <text class="t m g" x="268" y="100">pipeline-2026-09-26.jsonl</text>
  <text class="t n" x="268" y="120">one file per day, named by its date,</text>
  <text class="t n" x="268" y="134">so nobody ever renames it. Each line</text>
  <text class="t n" x="268" y="148">is appended whole, in one write.</text>

  <rect class="card" x="254" y="184" width="232" height="60" rx="8"/>
  <text class="t m" x="268" y="206">runs/nightly-20260926T010002Z/</text>
  <text class="t n" x="268" y="224">status.json and one log file per stage,</text>
  <text class="t n" x="268" y="238">same name as the run id</text>

  <path class="ln" d="M 486 122 L 526 150" marker-end="url(#a)"/>
  <path class="ln" d="M 486 214 L 526 186" marker-end="url(#a)"/>

  <rect class="p" x="530" y="120" width="154" height="96" rx="8"/>
  <text class="t k" x="544" y="144">the viewer</text>
  <text class="t n" x="544" y="164">started when needed,</text>
  <text class="t n" x="544" y="178">stops after 30 idle</text>
  <text class="t n" x="544" y="192">minutes, reads only</text>
  <text class="t n" x="544" y="206">what grew since last time</text>

  <rect class="card" x="16" y="268" width="668" height="96" rx="8"/>
  <text class="t lbl" x="32" y="292">EVERY LINE CARRIES</text>
  <text class="t m" x="32" y="314">run</text><text class="t n" x="108" y="314">which nightly run it belongs to, shared by every process in that run</text>
  <text class="t m" x="32" y="332">src · verb</text><text class="t n" x="108" y="332">which program wrote it, and which pipeline step</text>
  <text class="t m" x="32" y="350">pid</text><text class="t n" x="108" y="350">which process, so a line's neighbours can be shown from the same writer</text>
</svg>
