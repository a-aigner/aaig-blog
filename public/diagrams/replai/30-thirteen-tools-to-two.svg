<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 390" width="700" height="390" role="img">
  <style>
    .bg  { fill: #fbfbfa; }
    .card{ fill: #ffffff; stroke: rgb(26 26 26 / 0.12); stroke-width: 1; }
    .box { fill: rgb(26 26 26 / 0.035); stroke: rgb(26 26 26 / 0.12); stroke-width: 1; }
    .out { fill: #ffffff; stroke: #1a1a1a; stroke-width: 1; stroke-dasharray: 3 3; }
    .gbox{ fill: rgb(31 58 44 / 0.08); stroke: #1f3a2c; stroke-width: 1.2; }
    .wall{ fill: rgb(26 26 26 / 0.08); }
    .t   { font-family: ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif; fill: #1a1a1a; }
    .lbl { font-size: 9.5px; letter-spacing: 0.08em; fill: rgb(26 26 26 / 0.45); }
    .k   { font-size: 11.5px; font-weight: 600; }
    .m   { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.5px; }
    .n   { font-size: 10.5px; fill: rgb(26 26 26 / 0.6); }
    .g   { fill: #1f3a2c; }
    .ln  { stroke: #1a1a1a; stroke-width: 1.1; fill: none; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a1a"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="700" height="390"/>

  <!-- before -->
  <rect class="card" x="16" y="14" width="330" height="310" rx="8"/>
  <text class="t lbl" x="32" y="38">BEFORE: WHAT THE CHAT SHIPPED WITH</text>
  <text class="t k" x="32" y="58">13 built-in tools, offered with or without a key</text>

  <rect class="box" x="32" y="72" width="140" height="24" rx="4"/><text class="t m" x="42" y="88">calculator</text>
  <rect class="box" x="180" y="72" width="140" height="24" rx="4"/><text class="t m" x="190" y="88">ask_user_question</text>

  <text class="t n" x="32" y="118">11 of them send the question to a cloud service:</text>
  <g>
    <rect class="out" x="30" y="128" width="100" height="22" rx="4"/><text class="t m" x="37" y="143">Google</text>
    <rect class="out" x="132" y="128" width="100" height="22" rx="4"/><text class="t m" x="139" y="143">Tavily</text>
    <rect class="out" x="234" y="128" width="100" height="22" rx="4"/><text class="t m" x="241" y="143">Traversaal</text>
    <rect class="out" x="30" y="156" width="100" height="22" rx="4"/><text class="t m" x="37" y="171">DALL·E</text>
    <rect class="out" x="132" y="156" width="100" height="22" rx="4"/><text class="t m" x="139" y="171">OpenAI images</text>
    <rect class="out" x="234" y="156" width="100" height="22" rx="4"/><text class="t m" x="241" y="171">Gemini images</text>
    <rect class="out" x="30" y="184" width="100" height="22" rx="4"/><text class="t m" x="37" y="199">Flux</text>
    <rect class="out" x="132" y="184" width="100" height="22" rx="4"/><text class="t m" x="139" y="199">Stable Diffusion</text>
    <rect class="out" x="234" y="184" width="100" height="22" rx="4"/><text class="t m" x="241" y="199">Wolfram</text>
    <rect class="out" x="30" y="212" width="100" height="22" rx="4"/><text class="t m" x="37" y="227">Azure AI Search</text>
    <rect class="out" x="132" y="212" width="100" height="22" rx="4"/><text class="t m" x="139" y="227">OpenWeather</text>
  </g>
  <rect class="wall" x="32" y="252" width="294" height="10" rx="2"/>
  <text class="t n" x="32" y="282">On a product whose premise is that nothing</text>
  <text class="t n" x="32" y="296">leaves the building, every one of these is a door</text>
  <text class="t n" x="32" y="310">through that wall.</text>

  <!-- after -->
  <rect class="card" x="354" y="14" width="330" height="310" rx="8"/>
  <text class="t lbl" x="370" y="38">AFTER</text>
  <text class="t k" x="370" y="58">2 built-in tools, both local</text>

  <rect class="box" x="370" y="72" width="140" height="24" rx="4"/><text class="t m" x="380" y="88">calculator</text>
  <rect class="box" x="518" y="72" width="150" height="24" rx="4"/><text class="t m" x="528" y="88">ask_user_question</text>

  <text class="t n" x="370" y="118">plus the firm's own knowledge, one tool per source:</text>
  <rect class="gbox" x="370" y="128" width="298" height="26" rx="4"/><text class="t m g" x="380" y="145">search, CRM tickets</text>
  <rect class="gbox" x="370" y="160" width="298" height="26" rx="4"/><text class="t m g" x="380" y="177">search, firm documents</text>

  <text class="t n" x="370" y="212">Each knowledge search:</text>
  <text class="t n" x="370" y="230">asks the user first, and shows what it will send</text>
  <text class="t n" x="370" y="246">is offered only to people the console allowed</text>
  <text class="t n" x="370" y="262">is recorded in a log nobody can edit</text>
  <text class="t n" x="370" y="278">never leaves the firm's network</text>
  <text class="t k g" x="370" y="306">All of it answered inside the building.</text>

  <text class="t n" x="16" y="352">Tools are sorted by where the data goes (local or outbound), not by whether they only read.</text>
  <text class="t n" x="16" y="370">A search that only reads still sends your question to whoever answers it.</text>
</svg>
