<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="700" height="400" role="img">
  <style>
    .bg  { fill: #fbfbfa; }
    .card{ fill: #ffffff; stroke: rgb(26 26 26 / 0.12); stroke-width: 1; }
    .box { fill: rgb(26 26 26 / 0.035); stroke: rgb(26 26 26 / 0.12); stroke-width: 1; }
    .gbox{ fill: rgb(31 58 44 / 0.08); stroke: #1f3a2c; stroke-width: 1.2; }
    .off { fill: #ffffff; stroke: #1a1a1a; stroke-width: 1; stroke-dasharray: 3 3; }
    .p   { fill: #ffffff; stroke: #1a1a1a; stroke-width: 1.3; }
    .t   { font-family: ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif; fill: #1a1a1a; }
    .lbl { font-size: 9.5px; letter-spacing: 0.08em; fill: rgb(26 26 26 / 0.45); }
    .k   { font-size: 11.5px; font-weight: 600; }
    .m   { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10.5px; }
    .n   { font-size: 10.5px; fill: rgb(26 26 26 / 0.6); }
    .g   { fill: #1f3a2c; }
    .ln  { stroke: #1a1a1a; stroke-width: 1.2; fill: none; }
    .wall{ stroke: #1a1a1a; stroke-width: 3; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a1a"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="700" height="400"/>

  <!-- person -->
  <rect class="p" x="16" y="60" width="118" height="50" rx="25"/>
  <text class="t k" x="40" y="82">an employee</text>
  <text class="t n" x="40" y="97">asks a question</text>
  <path class="ln" d="M 134 85 L 160 85" marker-end="url(#a)"/>

  <!-- chat -->
  <rect class="card" x="164" y="20" width="196" height="200" rx="8"/>
  <text class="t k" x="178" y="44">the chat</text>
  <text class="t lbl" x="178" y="66">BEFORE A SEARCH RUNS</text>
  <text class="t n" x="178" y="88">1 · may this person use</text>
  <text class="t n" x="190" y="102">this source at all?</text>
  <text class="t n" x="178" y="124">2 · the person approves,</text>
  <text class="t n" x="190" y="138">seeing the search text</text>
  <text class="t n" x="178" y="160">3 · a record is appended</text>
  <text class="t n" x="190" y="174">that says a search happened,</text>
  <text class="t n" x="190" y="188">not what it was for</text>
  <path class="ln" d="M 360 110 L 386 110" marker-end="url(#a)"/>

  <!-- corpus server -->
  <rect class="gbox" x="390" y="60" width="160" height="100" rx="8"/>
  <text class="t k g" x="404" y="84">the corpus server</text>
  <text class="t n" x="404" y="104">one address per source</text>
  <text class="t n" x="404" y="120">knows no user at all</text>
  <text class="t n" x="404" y="136">no port outside the</text>
  <text class="t n" x="404" y="150">internal network</text>

  <path class="ln" d="M 550 90 L 576 72" marker-end="url(#a)"/>
  <path class="ln" d="M 550 130 L 576 148" marker-end="url(#a)"/>

  <rect class="box" x="580" y="46" width="104" height="48" rx="6"/>
  <text class="t k" x="590" y="66">CRM history</text>
  <text class="t n" x="590" y="82">firm-wide</text>
  <rect class="box" x="580" y="126" width="104" height="48" rx="6"/>
  <text class="t k" x="590" y="146">documents</text>
  <text class="t n" x="590" y="162">firm-wide only</text>

  <!-- the wall -->
  <line class="wall" x1="390" y1="196" x2="684" y2="196"/>
  <text class="t lbl" x="390" y="216">NO CODE PATH, NOT A FILTER</text>
  <rect class="off" x="390" y="228" width="294" height="54" rx="6"/>
  <text class="t k" x="402" y="250">mailboxes and personal documents</text>
  <text class="t n" x="402" y="268">The server cannot name them. A test reads its code.</text>

  <!-- console -->
  <rect class="card" x="16" y="248" width="344" height="100" rx="8"/>
  <text class="t k" x="30" y="272">the admin console decides who gets which source</text>
  <text class="t n" x="30" y="292">It records the decision straight away, then a reconciler</text>
  <text class="t n" x="30" y="306">makes the chat match it, after each change and on a</text>
  <text class="t n" x="30" y="320">schedule. The screen says which: "recorded, not yet in</text>
  <text class="t n" x="30" y="334">force" or "in force".</text>
  <path class="ln" d="M 262 248 L 262 224" marker-end="url(#a)"/>

  <text class="t n" x="16" y="376">"A filter is a line somebody can convert. A missing code path is not." From the design notes.</text>
</svg>
