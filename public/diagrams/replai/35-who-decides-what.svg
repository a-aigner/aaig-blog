<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" width="700" height="420" role="img">
  <style>
    .bg  { fill: #fbfbfa; }
    .card{ fill: #ffffff; stroke: rgb(26 26 26 / 0.12); stroke-width: 1; }
    .rule{ stroke: rgb(26 26 26 / 0.08); stroke-width: 1; }
    .gbox{ fill: rgb(31 58 44 / 0.08); stroke: #1f3a2c; stroke-width: 1.2; }
    .t   { font-family: ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif; fill: #1a1a1a; }
    .lbl { font-size: 9.5px; letter-spacing: 0.08em; fill: rgb(26 26 26 / 0.45); }
    .k   { font-size: 11.5px; font-weight: 600; }
    .b   { font-size: 11px; fill: #1a1a1a; }
    .n   { font-size: 11px; fill: rgb(26 26 26 / 0.6); }
    .g   { fill: #1f3a2c; }
  </style>
  <rect class="bg" x="0" y="0" width="700" height="420"/>

  <rect class="card" x="16" y="14" width="668" height="322" rx="8"/>
  <text class="t lbl" x="32" y="38">THE QUESTION</text>
  <text class="t lbl" x="262" y="38">WHAT DECIDES IT</text>
  <text class="t lbl" x="522" y="38">A CHANGE COUNTS</text>
  <line class="rule" x1="16" y1="50" x2="684" y2="50"/>

  <text class="t k" x="32" y="74">Can this person sign in?</text>
  <text class="t b" x="262" y="74">being on the firm's list of people</text>
  <text class="t n" x="522" y="68">15 minutes, the chat</text>
  <text class="t n" x="522" y="81">within the working day</text>
  <line class="rule" x1="16" y1="88" x2="684" y2="88"/>

  <text class="t k" x="32" y="112">Can they use the chat?</text>
  <text class="t b" x="262" y="112">a tick on the People screen</text>
  <text class="t n" x="522" y="112">at their next sign-in</text>
  <line class="rule" x1="16" y1="126" x2="684" y2="126"/>

  <text class="t k" x="32" y="150">Can they manage both products?</text>
  <text class="t b" x="262" y="150">one tick: administrator</text>
  <text class="t n" x="522" y="150">the same working day</text>
  <line class="rule" x1="16" y1="164" x2="684" y2="164"/>

  <text class="t k" x="32" y="188">Can they read info@?</text>
  <text class="t b" x="262" y="188">being added to that mailbox</text>
  <text class="t n" x="522" y="188">immediately</text>
  <line class="rule" x1="16" y1="202" x2="684" y2="202"/>

  <text class="t k" x="32" y="226">Can they search the CRM</text>
  <text class="t k" x="32" y="240">from the chat?</text>
  <text class="t b" x="262" y="226">a tick per person, per source</text>
  <text class="t n" x="522" y="226">within the hour</text>
  <line class="rule" x1="16" y1="254" x2="684" y2="254"/>

  <text class="t k" x="32" y="278">Which AI models, how long</text>
  <text class="t k" x="32" y="292">chats are kept?</text>
  <text class="t b" x="262" y="278">fixed when it was installed</text>
  <text class="t n" x="522" y="278">never by a click</text>
  <line class="rule" x1="16" y1="306" x2="684" y2="306"/>

  <text class="t k" x="32" y="328">How much does one colleague use it?</text>
  <text class="t b" x="262" y="328">nobody can see that</text>
  <text class="t n" x="522" y="328">only firm-wide totals</text>

  <rect class="gbox" x="16" y="350" width="668" height="56" rx="8"/>
  <text class="t k g" x="32" y="374">Every question has exactly one answer, in exactly one place</text>
  <text class="t b" x="32" y="394">and the screen that shows it also says where it is decided.</text>
</svg>
