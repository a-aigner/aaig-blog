<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" width="700" height="360" role="img">
  <style>
    .bg  { fill: #fbfbfa; }
    .card{ fill: #ffffff; stroke: rgb(26 26 26 / 0.12); stroke-width: 1; }
    .box { fill: rgb(26 26 26 / 0.035); stroke: rgb(26 26 26 / 0.12); stroke-width: 1; }
    .gbox{ fill: rgb(31 58 44 / 0.08); stroke: #1f3a2c; stroke-width: 1.2; }
    .p   { fill: #ffffff; stroke: #1a1a1a; stroke-width: 1.3; }
    .t   { font-family: ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif; fill: #1a1a1a; }
    .lbl { font-size: 9.5px; letter-spacing: 0.08em; fill: rgb(26 26 26 / 0.45); }
    .k   { font-size: 11.5px; font-weight: 600; }
    .m   { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10.5px; }
    .n   { font-size: 10.5px; fill: rgb(26 26 26 / 0.6); }
    .g   { fill: #1f3a2c; }
    .ln  { stroke: #1a1a1a; stroke-width: 1.2; fill: none; }
    .gl  { stroke: #1f3a2c; stroke-width: 1.4; fill: none; }
    .no  { stroke: rgb(26 26 26 / 0.4); stroke-width: 1.2; fill: none; stroke-dasharray: 4 3; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a1a"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f3a2c"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="700" height="360"/>

  <text class="t lbl" x="16" y="26">PEOPLE</text>
  <text class="t lbl" x="420" y="26">MAILBOXES</text>

  <rect class="p" x="16" y="44" width="170" height="54" rx="27"/>
  <text class="t k" x="40" y="68">Member A</text>
  <text class="t n" x="40" y="84">answers info@ too</text>

  <rect class="p" x="16" y="196" width="170" height="54" rx="27"/>
  <text class="t k" x="40" y="220">Member B</text>
  <text class="t n" x="40" y="236">answers info@ too</text>

  <rect class="box" x="420" y="40" width="264" height="62" rx="6"/>
  <text class="t k" x="432" y="62">A's own mailbox</text>
  <text class="t n" x="432" y="80">personal, belongs to exactly one person</text>

  <rect class="gbox" x="420" y="120" width="264" height="74" rx="6"/>
  <text class="t k g" x="432" y="142">info@example.de</text>
  <text class="t n" x="432" y="160">belongs to the firm, not to a person.</text>
  <text class="t n" x="432" y="174">Only named members may read it.</text>

  <rect class="box" x="420" y="212" width="264" height="62" rx="6"/>
  <text class="t k" x="432" y="234">B's own mailbox</text>
  <text class="t n" x="432" y="252">personal, belongs to exactly one person</text>

  <path class="ln" d="M 186 64 L 416 68" marker-end="url(#a)"/>
  <path class="gl" d="M 186 80 C 300 90, 330 150, 416 150" marker-end="url(#ag)"/>
  <path class="ln" d="M 186 232 L 416 240" marker-end="url(#a)"/>
  <path class="gl" d="M 186 214 C 300 200, 330 170, 416 164" marker-end="url(#ag)"/>

  <path class="no" d="M 186 92 C 260 150, 300 220, 410 236"/>
  <text class="t n" x="40" y="130">A asks for B's mail and gets</text>
  <text class="t m" x="40" y="146">404 not found</text>

  <rect class="card" x="16" y="292" width="668" height="54" rx="8"/>
  <text class="t k" x="32" y="314">What may a person read? Their own mail, plus every mailbox they are a member of.</text>
  <text class="t n" x="32" y="332">A refusal says "not found", never "forbidden", so it does not reveal that the other mailbox exists.</text>
</svg>
