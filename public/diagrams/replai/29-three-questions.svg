<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" width="700" height="330" role="img">
  <style>
    .bg  { fill: #fbfbfa; }
    .card{ fill: #ffffff; stroke: rgb(26 26 26 / 0.12); stroke-width: 1; }
    .gbox{ fill: rgb(31 58 44 / 0.08); stroke: #1f3a2c; stroke-width: 1.2; }
    .bad { fill: #ffffff; stroke: #1a1a1a; stroke-width: 1; stroke-dasharray: 3 3; }
    .t   { font-family: ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif; fill: #1a1a1a; }
    .lbl { font-size: 9.5px; letter-spacing: 0.08em; fill: rgb(26 26 26 / 0.45); }
    .k   { font-size: 11.5px; font-weight: 600; }
    .m   { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10.5px; }
    .n   { font-size: 10.5px; fill: rgb(26 26 26 / 0.6); }
    .g   { fill: #1f3a2c; }
  </style>
  <rect class="bg" x="0" y="0" width="700" height="330"/>

  <text class="t lbl" x="16" y="26">THREE QUESTIONS THAT USED TO HAVE ONE ANSWER</text>

  <rect class="card" x="16" y="40" width="214" height="150" rx="8"/>
  <text class="t k" x="30" y="64">May this person see it?</text>
  <text class="t n" x="30" y="86">Their own mail, plus every</text>
  <text class="t n" x="30" y="100">mailbox they belong to.</text>
  <text class="t lbl" x="30" y="128">ANSWER IS A UNION</text>
  <text class="t m g" x="30" y="150">visible_to(model, user)</text>
  <text class="t n" x="30" y="172">for screens and search</text>

  <rect class="card" x="243" y="40" width="214" height="150" rx="8"/>
  <text class="t k" x="257" y="64">Whose exactly is this?</text>
  <text class="t n" x="257" y="86">One owner: a person or the</text>
  <text class="t n" x="257" y="100">firm's mailbox, never both.</text>
  <text class="t lbl" x="257" y="128">ANSWER IS ONE OWNER</text>
  <text class="t m g" x="257" y="150">Owner.rows / voice_of</text>
  <text class="t n" x="257" y="172">for tone, contacts, signatures</text>

  <rect class="card" x="470" y="40" width="214" height="150" rx="8"/>
  <text class="t k" x="484" y="64">May this row point at that?</text>
  <text class="t n" x="484" y="86">A draft may hang off a message</text>
  <text class="t n" x="484" y="100">its author is allowed to read.</text>
  <text class="t lbl" x="484" y="128">ANSWER IS AN ENTITLEMENT</text>
  <text class="t m g" x="484" y="150">checked on save</text>
  <text class="t n" x="484" y="172">not "is B the same as A?"</text>

  <rect class="bad" x="16" y="208" width="668" height="106" rx="8"/>
  <text class="t k" x="32" y="232">What went wrong when the first answer was used for the second question</text>
  <text class="t n" x="32" y="254">The firm's letters addressed a customer as "du", because one member's private address book knew them personally.</text>
  <text class="t n" x="32" y="272">A member's own writing style was learned from up to forty of the firm's letters.</text>
  <text class="t n" x="32" y="290">The nightly index refused every member's mail, so their own stopped being indexed and the firm's never was.</text>
  <text class="t n" x="32" y="308">None of it failed loudly. The SQL of the refactor that caused it was byte-for-byte identical.</text>
</svg>
